name: hba-local
services:
  postgres:
    image: postgres:16-alpine
    container_name: hba-postgres
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: hba_admin
      POSTGRES_PASSWORD: hba_local_pwd
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hba_admin -d reservas"]
      interval: 5s
      retries: 5
    networks: [hba]

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: hba-elasticmq
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    networks: [hba]

volumes:
  pgdata:

networks:
  hba: {}